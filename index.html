<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f9df7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="趣味学堂">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="app-192.png">
<title>趣味学堂 · 我爱学</title>
<style>
  :root{
    --bg1:#aee1ff; --bg2:#c9f0ff; --bg3:#fff6d9;
    --ink:#3a3a5c;
    --card:#ffffff;
    --shadow:0 8px 24px rgba(60,90,180,.18);
    --chinese:#ff6b7a; --chinese2:#ff9a8b;
    --math:#4f9df7; --math2:#7cc4ff;
    --english:#7bc86c; --english2:#a8e063;
    --gold:#ffc53d;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:linear-gradient(160deg,var(--bg2),var(--bg1) 55%,var(--bg3));
  }
  .sky{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
  .sky .c{position:absolute; font-size:34px; opacity:.25; animation:float 12s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-28px) rotate(8deg)}}
  .cloud{position:absolute; width:120px; height:40px; background:#fff; border-radius:40px; opacity:.5; animation:drift 40s linear infinite;}
  .cloud::before,.cloud::after{content:""; position:absolute; background:#fff; border-radius:50%;}
  .cloud::before{width:45px;height:45px;top:-22px;left:22px;}
  .cloud::after{width:34px;height:34px;top:-12px;right:18px;}
  @keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}

  /* ===== 年级专属动画 ===== */
  .gconfetti,.spark{position:fixed;z-index:80;pointer-events:none;will-change:transform,opacity;}
  .gconfetti{bottom:-46px;animation:confUp var(--dur,1.8s) ease-out forwards;}
  @keyframes confUp{0%{transform:translateY(0) rotate(0) scale(.6);opacity:0}12%{opacity:1}100%{transform:translateY(-108vh) translateX(var(--dx,0)) rotate(var(--rot,320deg)) scale(1);opacity:0}}
  .spark{animation:sparkOut var(--dur,.85s) ease-out forwards;}
  @keyframes sparkOut{0%{transform:translate(0,0) scale(.5);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
  .mascot{border-radius:50%;background:#fff;display:grid;place-items:center;animation:mWobble 1.6s ease-in-out infinite;box-shadow:var(--shadow);}
  @keyframes mWobble{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
  .hm-pop{animation:hmPop .6s ease;}
  @keyframes hmPop{0%{transform:scale(.3) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
  #gradeTag{transition:transform .3s;}
  body[data-g="1"]{--glow:rgba(255,154,61,.30)}body[data-g="2"]{--glow:rgba(123,200,108,.30)}
  body[data-g="3"]{--glow:rgba(86,194,201,.30)}body[data-g="4"]{--glow:rgba(79,157,247,.30)}
  body[data-g="5"]{--glow:rgba(192,127,247,.30)}body[data-g="6"]{--glow:rgba(57,196,180,.30)}
  .hero h1{transition:color .4s;}
  .fresh{display:inline-block;background:linear-gradient(135deg,#7bc86c,#a8e063);color:#fff;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;margin-left:6px;box-shadow:0 2px 8px rgba(123,200,108,.5);}
  .fresh-tip{margin:10px auto 4px;background:#eef7ff;border:1.5px dashed #7cc4ff;color:#4f7bb0;font-size:13px;font-weight:700;border-radius:14px;padding:8px 12px;max-width:340px;line-height:1.5;}

  /* ===== 移动端触控与安装 ===== */
  .install{display:none;align-items:center;gap:5px;background:linear-gradient(135deg,#7bc86c,#a8e063);color:#fff;
    border:none;border-radius:14px;padding:6px 11px;font-size:13px;font-weight:800;cursor:pointer;
    box-shadow:0 4px 12px rgba(123,200,108,.4);font-family:inherit;}
  .install.show{display:inline-flex;}
  .install:active{transform:scale(.95);}
  button,.opt,.gbtn,.game,.sel-key,.back,.btn{cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;}
  body{overscroll-behavior:none;}
  /* 手机竖屏 / 平板安全区与可点区域 */
  @media (max-width:480px){
    #app{padding-left:calc(14px + env(safe-area-inset-left));padding-right:calc(14px + env(safe-area-inset-right));}
    main{padding-bottom:calc(20px + env(safe-area-inset-bottom));}
    body{background:linear-gradient(160deg,#cdf2ff,#9fd8ff 55%,#fff3cf);}
    .hero .big{font-size:52px;}
    .hero h1{font-size:23px;}
    .opt{min-height:52px;font-size:18px;align-items:center;}
    .btn{min-height:48px;}
    header.top{flex-wrap:wrap;gap:6px;}
  }
  @media (min-width:481px) and (max-width:1024px){
    .install span.hint{display:none;}
  }

  #app{position:relative; z-index:1; height:100vh; max-width:820px; margin:0 auto;
    display:flex; flex-direction:column; padding:0 16px;}

  header.top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 4px 8px; flex-shrink:0;
  }
  .logo{display:flex; align-items:center; gap:8px; font-weight:900; font-size:22px; letter-spacing:.5px;}
  .logo .bubble{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--chinese),var(--math) 55%,var(--english));
    display:grid;place-items:center;font-size:20px;color:#fff; box-shadow:var(--shadow);}
  .stats{display:flex; gap:8px;}
  .stat{background:#fff; border-radius:16px; padding:6px 12px; font-size:14px; font-weight:700; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:5px;}
  .stat .ico{font-size:16px;}

  main{flex:1; overflow-y:auto; padding-bottom:20px; scrollbar-width:thin;}
  main::-webkit-scrollbar{width:6px;}
  main::-webkit-scrollbar-thumb{background:#bcd7ff; border-radius:10px;}

  .screen{display:none; animation:pop .35s ease;}
  .screen.active{display:block;}
  @keyframes pop{from{opacity:0; transform:translateY(14px)}to{opacity:1;transform:none}}

  /* 年级选择条 */
  .grade-bar{background:linear-gradient(180deg,#ffffff,#f6faff); border-radius:24px; box-shadow:var(--shadow); padding:14px 12px 16px; margin-top:4px;}
  .grade-bar .glabel{font-size:13px; font-weight:800; text-align:center; margin-bottom:12px; letter-spacing:2px; color:#5a6b8c;}
  .grade-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .gbtn{border:none; background:#eef4ff; border:3px solid transparent; border-radius:18px; padding:9px 13px; cursor:pointer;
    font-weight:800; font-size:14px; color:var(--ink); font-family:inherit; transition:all .16s cubic-bezier(.34,1.56,.64,1); min-width:58px; box-shadow:0 2px 6px rgba(80,110,180,.08);}
  .gbtn small{display:block; font-size:10px; color:#8294b0; font-weight:700;}
  .gbtn:hover{transform:scale(1.06); box-shadow:0 6px 14px rgba(80,110,180,.16);}
  .gbtn.on{ background:linear-gradient(135deg,#ffd76a,#ffab2e); border-color:#fff; color:#5a3a00; box-shadow:0 6px 16px rgba(255,171,46,.4); animation:pop .25s;}
  .gbtn.on small{color:#7a5200;}

  .hero{text-align:center; padding:24px 10px 16px;}
  .hero .big{font-size:60px; line-height:1;}
  .hero h1{font-size:27px; margin-top:6px;}
  .hero p{color:#5a6b8c; font-weight:600; margin-top:6px; font-size:14px;}
  .hero .mascot{width:84px;height:84px;border-radius:50%;background:#fff; margin:0 auto 8px; box-shadow:var(--shadow);
    display:grid;place-items:center; font-size:52px; animation:bob 2.4s ease-in-out infinite;}
  .hero .grade-tag{display:inline-block; background:#fff; padding:6px 18px; border-radius:30px; font-weight:900; font-size:16px;
    box-shadow:var(--shadow); margin-top:8px; color:var(--math);}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:6px 4px 10px;}
  @media(max-width:460px){.grid3{grid-template-columns:1fr 1fr 1fr; gap:8px;}}
  .subject-card{background:linear-gradient(180deg,#ffffff,#f7faff); border-radius:24px; padding:20px 10px; text-align:center; cursor:pointer;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s; box-shadow:var(--shadow); border-bottom:6px solid transparent; position:relative; overflow:hidden;}
  .subject-card::after{content:""; position:absolute; top:-30px; right:-30px; width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(150,190,255,.18),transparent 70%);}
  .subject-card:active{transform:scale(.95);}
  .subject-card:hover{transform:translateY(-4px); box-shadow:0 14px 28px rgba(60,90,180,.22);}
  .subject-card .ico{font-size:44px; display:block; margin-bottom:8px; transition:transform .2s;}
  .subject-card:hover .ico{transform:scale(1.15) rotate(-6deg);}
  .subject-card h3{font-size:19px;}
  .subject-card p{font-size:11px; color:#8294b0; margin-top:3px; font-weight:600;}
  #cardChinese{border-color:var(--chinese);} #cardChinese .ico{filter:drop-shadow(0 4px 6px rgba(255,107,122,.4))}
  #cardMath{border-color:var(--math);} #cardMath .ico{filter:drop-shadow(0 4px 6px rgba(79,157,247,.4))}
  #cardEnglish{border-color:var(--english);} #cardEnglish .ico{filter:drop-shadow(0 4px 6px rgba(123,200,108,.4))}

  .section-title{display:flex; align-items:center; gap:8px; font-size:18px; font-weight:800; margin:20px 6px 10px;}
  .section-title .pill{background:#fff; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700; box-shadow:var(--shadow);}
  .chip-row{display:flex; gap:10px; flex-wrap:wrap; padding:0 6px;}
  .chip{background:#fff; border-radius:22px; padding:11px 19px; font-weight:800; cursor:pointer; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:8px; transition:transform .15s cubic-bezier(.34,1.56,.64,1),box-shadow .15s; border-bottom:4px solid transparent;}
  .chip:active{transform:scale(.93);}
  .chip:hover{transform:translateY(-2px);}
  .chip .t{font-size:16px;}
  .chip .d{font-size:11px; color:#8294b0; font-weight:600;}
  .chip.col{flex-direction:column; text-align:center; padding:14px 12px; min-width:118px; color:#fff; border-bottom:none;}
  .chip.col .t{font-size:15px; line-height:1.3;}
  .chip.col .d{color:#ffffffd9; font-size:11px;}

  .subtitle-home{font-size:12px; color:#5a6b8c; font-weight:600; padding:0 8px; margin-top:24px; text-align:center;}

  /* 问答 */
  .quiz-head{display:flex; align-items:center; gap:10px; padding:6px 4px;}
  .back{margin-left:auto; background:#fff;border:none;border-radius:14px;padding:8px 12px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);white-space:nowrap}
  .back:first-child{margin-left:0;}
  .progress{height:12px;background:#e6eef9;border-radius:12px;overflow:hidden;margin-bottom:6px;flex:1;box-shadow:inset 0 2px 4px rgba(80,110,180,.12);}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--math2),var(--math));background-size:200% 100%;animation:flow 2.5s linear infinite;transition:width .4s;border-radius:12px;}
  @keyframes flow{from{background-position:200% 0}to{background-position:0 0}}
  .q-label{font-size:13px;font-weight:800;color:#8294b0;letter-spacing:2px;}
  .card-q{background:linear-gradient(180deg,#ffffff,#fbfdff); border-radius:26px; padding:22px 18px; box-shadow:0 -6px 0 var(--math2),var(--shadow); text-align:center; margin-bottom:16px; position:relative;}
  .card-q::after{content:"✨"; position:absolute; top:12px; right:16px; font-size:18px; opacity:.5;}
  .q-text{font-size:44px; font-weight:900; margin:14px 0 18px; line-height:1.2; word-break:break-word; text-shadow:0 2px 0 rgba(255,255,255,.6);}
  .q-text .hanzi-big{font-size:120px; line-height:1; font-weight:900;}
  .q-sub{font-size:15px; color:#5a6b8c; margin-bottom:16px; font-weight:700;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:14px; perspective:600px;}
  .opt{background:linear-gradient(180deg,#ffffff,#f4f8ff); border:3px solid #dfe9fb; border-radius:20px; padding:18px 8px; font-size:24px; font-weight:900;
    cursor:pointer; transition:all .16s cubic-bezier(.34,1.56,.64,1); color:var(--ink); word-break:break-word; display:flex;align-items:center;justify-content:center;min-height:66px;
    box-shadow:0 4px 10px rgba(80,110,180,.12);}
  .opt:active{transform:scale(.94);}
  .opt:hover{transform:translateY(-2px); box-shadow:0 8px 18px rgba(80,110,180,.18); border-color:var(--math2);}
  .opt.opt-sm{font-size:20px;}
  .opt.correct{background:#e6fbe6; border-color:#67c23a; animation:win .5s;}
  .opt.wrong{background:#ffe3e3; border-color:#ff6b6b; animation:shake .4s;}
  .opt.disabled{pointer-events:none; opacity:.75;}
  @keyframes win{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .feedback{min-height:26px; font-size:15px; font-weight:800; margin-top:14px; text-align:center;}
  .feedback.ok{color:#67c23a;} .feedback.no{color:#ff6b6b;}
  .article-box{background:linear-gradient(160deg,#fffdf5,#fff8e6); border:2px solid #ffe6b8; border-radius:18px; padding:16px 18px; margin-bottom:12px; box-shadow:0 4px 12px rgba(200,160,60,.12);}
  .article-title{font-size:18px; font-weight:900; color:#b8860b; margin-bottom:8px; letter-spacing:1px;}
  .article-text{font-size:17px; line-height:1.9; color:#5a4a2a; text-align:left;}
  .exp{margin-top:12px; padding:12px 14px; border-radius:14px; background:linear-gradient(135deg,#eef6ff,#e6f0ff); border:1px dashed #8fb8ec; color:#33618c; font-size:14px; font-weight:700; line-height:1.7; text-align:left;}
  .listen-hint{display:none;}
  .listen-prompt{font-size:18px; font-weight:800; color:#5a6b8c; margin:4px 0 8px; line-height:1.6;}
  .tingzi-play{margin:6px auto 2px; width:180px; padding:14px 16px; border:none; border-radius:24px; background:linear-gradient(135deg,#7cd177,#2ea96b); color:#fff; font-size:21px; font-weight:900; cursor:pointer; box-shadow:0 6px 16px rgba(46,169,107,.32); display:flex; align-items:center; justify-content:center; gap:6px; letter-spacing:1px;}
  .tingzi-play:active{transform:scale(.94);}
  .tian{width:150px; height:150px; margin:6px auto; position:relative; display:flex; align-items:center; justify-content:center; border:3px solid #cfe0f5; border-radius:10px; background:#f8fbff;}
  .tian::before{content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent calc(50% - 1px),#d7e5f7 calc(50% - 1px),#d7e5f7 calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(0deg,transparent calc(50% - 1px),#d7e5f7 calc(50% - 1px),#d7e5f7 calc(50% + 1px),transparent calc(50% + 1px));}
  .tian-char{position:relative; font-size:110px; font-weight:900; color:#35415e; line-height:1;}
  .hz-pinyin{font-size:20px; font-weight:900; color:#b8860b; margin-top:8px;}
  .hz-word{font-size:17px; font-weight:800; color:#5a4a2a; margin-top:6px;}
  .hz-stroke{font-size:15px; font-weight:800; color:#8294b0; margin-top:6px;}
  .action-bar{display:flex; gap:12px; margin-top:8px;}
  .btn{flex:1; border:none; border-radius:24px; padding:16px; font-size:17px; font-weight:900; cursor:pointer;
    color:#fff; box-shadow:0 6px 16px rgba(80,110,180,.25); transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s; font-family:inherit; letter-spacing:1px;}
  .btn:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(80,110,180,.32);}
  .btn:active{transform:scale(.95);}
  .btn-next{background:linear-gradient(135deg,var(--math2),var(--math));}
  .btn-finish{background:linear-gradient(135deg,var(--gold),#ffab2e); color:#5a3a00;}
  .btn-hidden{visibility:hidden;}

  .result-box{background:linear-gradient(180deg,#fff,#fffdf4); border-radius:30px; padding:32px 20px; text-align:center; box-shadow:0 -6px 0 var(--gold),var(--shadow); margin-top:8px; position:relative; overflow:hidden;}
  .result-box::before{content:""; position:absolute; top:-40px; left:-40px; width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,197,61,.25),transparent 70%);}
  .confetti{font-size:64px; animation:win 1s;}
  .result-title{font-size:26px; font-weight:900; margin:10px 0 6px;}
  .result-sub{color:#5a6b8c; font-weight:700;}
  .score-line{font-size:42px; font-weight:900; color:var(--math); margin:14px 0;}
  .stars{font-size:38px; letter-spacing:6px; margin:12px 0;}
  .star{display:inline-block; opacity:.25; filter:grayscale(1);}
  .star.on{opacity:1; filter:none; animation:win .5s;}
  .new-badge{display:inline-block; background:#fff8e6; color:#d48806; border:2px solid var(--gold);
    border-radius:20px; padding:8px 16px; font-weight:800; margin-top:10px; font-size:15px;}
  .btn-row{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}
  .btn.go{background:linear-gradient(135deg,var(--english2),var(--english)); flex:1; min-width:130px;}

  .ext-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;padding-bottom:24px;}
  .ext-card{background:linear-gradient(180deg,#fff,#f4f8ff);border:2px solid #e3ecfa;border-radius:22px;padding:20px 14px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s;}
  .ext-card:hover{transform:translateY(-3px);}
  .ext-chip{background:linear-gradient(135deg,#b56bff,#7a3ff0);}
  .ext-chip .t{color:#fff!important;}
  .ext-emo{font-size:34px;line-height:1;}
  .ext-name{font-size:17px;font-weight:900;color:#2a3a55;margin-top:6px;}
  .ext-desc{font-size:12px;color:#8a9ab8;font-weight:600;margin-top:4px;}
  .plan-item{display:flex;align-items:center;gap:10px;background:#f7faff;border:1px solid #e6eefb;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;}
  .plan-check{font-size:20px;}
  .plan-t{font-weight:900;color:#2a3a55;font-size:16px;}
  .plan-s{color:#8a9ab8;font-size:12px;font-weight:600;margin-left:auto;}
  .plan-done{background:#eefbe9;border-color:#bcE9a8;}
  .wrong-item{display:flex;align-items:center;gap:8px;padding:10px 8px;border-bottom:1px dashed #e6eefb;}
  .wrong-n{color:#c3a5ff;font-weight:900;}
  .wrong-q{flex:1;color:#3a4a66;font-size:14px;font-weight:600;}
  .wrong-del{background:#ffe3e3;border:none;border-radius:10px;color:#ff6b6b;width:24px;height:24px;font-weight:900;cursor:pointer;}
  .text-card{background:linear-gradient(180deg,#fffdf5,#fff8e6);border:2px solid #ffe6b8;border-radius:18px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 12px rgba(200,160,60,.12);cursor:pointer;}
  .text-title{font-size:18px;font-weight:900;color:#b8860b;margin-bottom:6px;}
  .text-body{font-size:16px;line-height:1.9;color:#5a4a2a;font-family:"STKaiti","KaiTi","PingFang SC",serif;}
  .text-act{margin-top:8px;text-align:right;}
  .read-poem{font-size:22px;line-height:2.2;text-align:center;font-family:"STKaiti","KaiTi","PingFang SC",serif;font-weight:700;color:#3a3a5c;padding:14px 0;}
  .learn-card{background:linear-gradient(180deg,#fff,#fbfdff);border-radius:28px;box-shadow:0 -6px 0 var(--english2),var(--shadow);padding:24px;text-align:center;margin-bottom:16px;}
  .learn-title{font-size:24px;font-weight:900;margin-bottom:10px;}
  .poem{font-size:23px;line-height:2;font-family:"STKaiti","KaiTi","PingFang SC",serif;font-weight:700;color:#3a3a5c;}
  .word-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .word-tile{background:linear-gradient(180deg,#fff,#f4f9ff);border-radius:22px;box-shadow:var(--shadow);padding:18px;text-align:center;cursor:pointer;transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s;border-bottom:4px solid var(--english2);}
  .word-tile:active{transform:scale(.94);}
  .word-tile:hover{transform:translateY(-3px); box-shadow:0 12px 22px rgba(80,110,180,.2);}
  .word-tile .en{font-size:23px;font-weight:900;}
  .word-tile .zh{font-size:14px;color:#5a6b8c;font-weight:700;margin-top:4px;}
  .shape-row{display:flex; justify-content:center; gap:8px; font-size:32px; flex-wrap:wrap; margin:6px 0;}
  .pinyin{color:var(--math); font-weight:800;}

<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
function rndInt(n){return Math.floor(Math.random()*n);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(a){return a[rndInt(a.length)];}
/* 每局题目数：随年级递增 */
function qN(g){return [16,17,18,18,18,18,18,18,18][(g-1)>>>0]||16;}
const D='零一二三四五六七八九';

/* ================= 数字转中文（用于认数） ================= */
function numToChinese(n){
  n=Math.floor(+n); if(n===0)return '零';
  if(n>=100000000)return String(n);
  const P=['','十','百','千','万','十','百','千'];
  let s=String(n),L=s.length,out='',zero=false;
  for(let i=0;i<L;i++){
    const d=+s[i],pos=L-1-i,place=P[pos]||'';
    if(d===0){ if(out)zero=true; continue; }
    if(zero){out+='零';zero=false;}
    let lead=D[d];
    if(d===1&&place==='十'&&pos===1&&L===2)lead='';
    out+=lead+place;
  }
  return out||'零';
}

/* ================= 多用户档案 ================= */
const USERS_KEY='funUsers';
let users={list:[],current:null};let firstRun=false;
function _uid(){return users.current||null;}
function _K(b){return _uid()?b+':'+_uid():b;}
function saveUsers(){try{localStorage.setItem(USERS_KEY,JSON.stringify(users));}catch(e){}}
function _getUser(uid){return users.list.find(u=>u.id===uid);}
function _defaultKid(){return {id:'kid1',name:'宝贝',emoji:'🦊',role:'kid',pw:'123456'};}
function migrateLegacy(uid){
  const pairs=[['funSchool','funSchool:'],['funExtend','funExtend:'],['funPuzzle','funPuzzle:']];
  for(const[o,n]of pairs){const v=localStorage.getItem(o);if(v&&!localStorage.getItem(n+uid))localStorage.setItem(n+uid,v);}
  try{const r=JSON.parse(localStorage.getItem(RW_KEY)||'null');if(r&&Array.isArray(r.claims)&&r.claims.length&&!localStorage.getItem('funRewardC:'+uid))localStorage.setItem('funRewardC:'+uid,JSON.stringify(r.claims));}catch(e){}
}

function playSound(kind,g){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const ctx=new C(),now=ctx.currentTime;
    const st=gstyle(g),notes=st.sq||[523,659,784];
    let seq;
    if(kind==='correct')seq=notes;
    else if(kind==='finish')seq=notes.concat([notes[notes.length-1]*1.5]);
    else if(kind==='open')seq=[notes[0],notes[notes.length-1]];
    else seq=[220,180];
    const wave=kind==='wrong'?'square':(st.wave||'triangle');
    const step=kind==='wrong'?.14:(st.step||.13);
    seq.forEach((fr,i)=>{const o=ctx.createOscillator(),gg=ctx.createGain();o.type=wave;o.frequency.value=fr;
      gg.gain.setValueAtTime(.001,now+i*step);gg.gain.exponentialRampToValueAtTime(.16,now+i*step+.02);
      gg.gain.exponentialRampToValueAtTime(.001,now+i*step+.16);o.connect(gg);gg.connect(ctx.destination);
      o.start(now+i*step);o.stop(now+i*step+.2);});
  }catch(e){}
}
let _ttsVoices=[];let _ttsWarned={zh:false,en:false};let _ttsOnline=null;let _ttsOn=false;
function _pickVoice(lang){const base=lang.split('-')[0].toLowerCase();return _ttsVoices.find(v=>v.lang.toLowerCase().indexOf(lang.toLowerCase())===0)||_ttsVoices.find(v=>v.lang.toLowerCase().indexOf(base)===0);}
function _refreshVoices(){try{_ttsVoices=window.speechSynthesis.getVoices()||[];}catch(e){_ttsVoices=[];}return _ttsVoices;}
if('speechSynthesis'in window){_refreshVoices();window.speechSynthesis.onvoiceschanged=()=>{_refreshVoices();try{if(window.speechSynthesis.pending||window.speechSynthesis.speaking)setTimeout(()=>window.speechSynthesis.resume(),120);}catch(e){}};}
function _speakOnline(text,lang){_ttsOn=true;try{if(!_ttsOnline&&typeof Audio!=='undefined')_ttsOnline=new Audio();if(_ttsOnline){_ttsOnline.src='https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type='+(lang.indexOf('en')===0?2:1);_ttsOnline.play&&_ttsOnline.play().catch(()=>{});}}catch(e){}}
function _hasZhVoice(){return _ttsVoices.some(v=>/zh|cmn|yue|chinese/i.test(v.lang));}
function _hasEnVoice(){return _ttsVoices.some(v=>/en|english/i.test(v.lang));}
function _ttsLocalOk(kind){if(!('speechSynthesis'in window))return false;return kind==='zh'?_hasZhVoice():_hasEnVoice();}
function _doSpeak(t,lang,rate,key){const kind=lang.indexOf('en')===0?'en':'zh';
  if(!('speechSynthesis'in window)){_speakOnline(t,lang);return;}
  _refreshVoices();
  if(!_ttsLocalOk(kind)){_speakOnline(t,lang);if(!_ttsWarned[key]){_ttsWarned[key]=true;toast('🔈 设备未装'+((kind==='en')?'英文':'中文')+'语音包，已自动切换为在线发音（需联网）');}return;}
  const v=_pickVoice(lang);
  window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=rate;if(v){u.voice=v;}
  const trySpeak=()=>{try{window.speechSynthesis.speak(u);}catch(e){_speakOnline(t,lang);}};
  trySpeak();}
function speakEn(t){_doSpeak(t,'en-US',.8,'en');}
function speakZh(t){_doSpeak(t,'zh-CN',.8,'zh');}
function speakByLang(t,lang){if(lang==='zh'||lang.indexOf('zh')===0)speakZh(t);else speakEn(t);}

  const body=$('#screen-subject');

    const st=m.steps[s];
    body.innerHTML=`
      <div class="quiz-head">${back}<span class="q-label">方法 ${s+1}/${m.steps.length}</span></div>
      <div class="method-banner" onclick="togglePlay()">${playing?'⏸ 暂停':'▶ 播放'} · ${m.emoji} ${m.title}计算妙招</div>

        <div class="method-demo">${st.demo}</div>

        <div class="method-step-sub">${st.sub}</div>
        <div class="method-bubbles">${m.steps.map(x=>`<span class="method-bubble" style="animation-delay:${qindex*0.15}s">${x.demo}</span>`).join('')}</div>
      </div>
      <div class="method-dots">${m.steps.map((_,i)=>`<div class="method-dot ${i===s?'on':''}"></div>`).join('')}</div>
      <div class="action-bar" style="margin-top:16px;justify-content:center">
        <button class="btn btn-finish" onclick="prevStep()">← 上一步</button>
        <button class="btn go" onclick="nextStep()">${s===m.steps.length-1?'✅ 看完了':'下一步 →'}</button>
      </div>`;
  };
  function qindex(){return s;}
  function nextStep(){if(s<m.steps.length-1){s++;render();}else{s=0;render();toast('🎉 '+m.title+'方法看完啦');}}
  function prevStep(){if(s>0){s--;render();}}
  function togglePlay(){playing=!playing;if(playing)runAuto();}
  function runAuto(){
    if(!playing)return;
    if(s<m.steps.length-1){s++;render();_methodTimer=setTimeout(()=>{s++;runAuto();},2600);}else{playing=false;toast('🎉 播放完毕');}
  }
  window.nextStep=nextStep;window.prevStep=prevStep;window.togglePlay=togglePlay;

}

/* 读标准了才得分。依赖 Web Speech API（Chrome/Edge）；不支持时自动降级为听读 */
let _sr=null;
function srAvail(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}
function norm(t){return String(t||'').toLowerCase().replace(/[\s,。.!！?？.]+/g,'').trim();}
function simScore(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;if(a.indexOf(b)>=0||b.indexOf(a)>=0)return .9;
  const d=editDist(a,b),mx=Math.max(a.length,b.length);return mx?1-d/mx:0;}
function editDist(a,b){const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];}
/* 通用跟读：target=要读的内容, lang='zh-CN'或'en-US', outId=结果容器, extraPoints=可加星 */
function readAlong(target,lang,outId,extraPoints){
  const out=document.getElementById(outId);
  const done=(ok,txt)=>{if(!out)return;out.className='read-result '+(ok?'ok':'no');
    out.innerHTML=ok?('🎉 读得很标准！那你记牢啦 +'+((extraPoints||2)*5)+'⭐') : ('你读的是：“'+txt+'” 再听一遍标准音试试～');
    if(ok){playSound('correct',state.grade);addXp(extraPoints||2);floatScore();}else{playSound('wrong',state.grade);}};
  if(!srAvail()){speakByLang(target,lang);done(false,'');toast('当前浏览器不支持语音识别，先听标准发音跟读吧~');return;}
  _sr=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  _sr.lang=lang;_sr.interimResults=false;_sr.maxAlternatives=5;
  let got=false;
  _sr.onstart=()=>{if(out)out.className='read-result no';if(out)out.innerHTML='🎤 请大声读：'+target+'……';};
  _sr.onresult=(e)=>{
    let best='',sc=0;
    for(let k=0;k<e.results.length;k++){for(let j=0;j<e.results[k].length;j++){const t=e.results[k][j].transcript;const s=simScore(t,target);if(s>sc){sc=s;best=t;}}}
    const ok=sc>=0.72;got=true;done(ok,best);
  };
  _sr.onerror=(e)=>{if(got)return;if(e.error==='not-allowed'){speakByLang(target,lang);if(out)out.innerHTML='⚠️ 要允许麦克风才能跟读打分哦';}
    else{speakByLang(target,lang);done(false,'' );}};
  _sr.onend=()=>{if(!got){speakByLang(target,lang);if(out&&out.className!=='read-result ok'){}}};
  try{_sr.start();}catch(err){speakByLang(target,lang);done(false,'');}
}
function floatScore(){try{const e=document.createElement('div');e.className='score-pop';e.textContent='+5 ⭐';const x=(window.innerWidth/2),y=(window.innerHeight/2);e.style.left=x+'px';e.style.top=y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),950);}catch(err){}}
function numAnswer(right,lo,hi){
  const set=[right];let g=0;
  while(set.length<4&&g++<100){let o=right+rndInt(11)-5;if(o!==right&&o>=lo&&o<=hi&&!set.includes(o))set.push(o);}
  if(set.length<4&&-5<=right&&right<=5){let o=right;while(set.length<4){o=right+(set.length);if(!set.includes(o))set.push(o);}}
  const sh=shuffle(set);
  return {options:sh.map(String), answer:sh.indexOf(right)};
}
function strAnswer(right,dstr){
  const set=[right];for(const d of dstr)if(!set.includes(d))set.push(d);
  const sh=shuffle(set.slice(0,4));
  return {options:sh, answer:sh.indexOf(right)};
}
function romRange(word){
  // 生成单词拼写干扰项
  const res=new Set();const a=word.split('');
  for(let i=0;i<a.length-1;i++){const b=a.slice();const t=b[i];b[i]=b[i+1];b[i+1]=t;if(b.join('')!==word)res.add(b.join(''));}
  if(a.length>2)for(const i of [0,1,a.length-1]){const b=a.slice();b.splice(i,1);res.add(b.join(''));}
  const vows=[['a','e'],['e','a'],['i','e'],['o','u']];
  for(const [f,t]of vows){const idx=word.indexOf(f);if(idx>=0){const b=a.slice();b[idx]=t;res.add(b.join(''));}}
  return [...res].filter(x=>x!==word);
}

/* 数学题型统一出题：计算类按 基础/提高/挑战 70/20/10 配比，其余单档 */
function rawMathDif(type,g,d){d=d||0;
  return ({count:(x)=>buildCount(x),compare:(x)=>buildCompare(x),shapes:(x)=>buildShapes(x),addsub:(x)=>buildAddsub(x,d),mulsmall:(x)=>buildMulsmall(x,d),bigadd:(x)=>buildBigadd(x,d),muldiv:(x)=>buildMuldiv(x,d),div:(x)=>buildDiv(x,d),mixed:(x)=>buildMixed(x,d),order:(x)=>buildOrder(x),dec:(x)=>buildDec(x),frac:(x)=>buildFrac(x),pct:(x)=>buildPct(x),clock:(x)=>buildClock(x),money:(x)=>buildMoney(x),units:(x)=>buildUnits(x),shapearea:(x)=>buildShapeArea(x),factor:(x)=>buildFactor(x),equation:(x)=>buildEquation(x),circle:(x)=>buildCircle(x),ratio:(x)=>buildRatio(x)}[type])(g);
}
function buildMathTiered(type,g){
  if(!ARITH.includes(type))return rawMathDif(type,g,0);
  const nB=Math.ceil(qN(g)*0.7),nU=Math.round(qN(g)*0.2),nC=qN(g)-nB-nU;
  const sB=rawMathDif(type,g,0)||[],sU=rawMathDif(type,g,1)||[],sC=rawMathDif(type,g,2)||[];
  const seen=new Set(),out=[];const pushU=(arr)=>{for(const q of arr||[]){const k=stripT(q.q);if(!seen.has(k)){seen.add(k);out.push(q);}}};
  pushU(sB.slice(0,nB));pushU(sU.slice(0,nU));pushU(sC.slice(0,nC));
  let tries=0;while(out.length<qN(g)&&tries++<60){pushU(rawMathDif(type,g,0));}
  return out.slice(0,qN(g));
}

function buildLetters(g){const set=[];const letters=shuffle('ABCDEFGIJKLMNOPQRSTUVWXYZ'.split(''));

  for(let i=0;i<Math.min(qN(g),pool.length);i++){const [en,emo,zh]=pool[i];const fallen=simplerom(en.toLowerCase());const r=strAnswer(en.toLowerCase(),fallen);

function simplerom(w){const a=w.split('');const res=[]

    if(m===0&&a.length>2){const b=a.slice();const t=b[k];b[k]=b[k+1];b[k+1]=t;v=b.join('');}

    else if(m===2){const b=a.slice();b.splice(k,0,a[k]);v=b.join('');}
    else{const b=a.slice();b[k]=pick('aeiou'.split(''));v=b.join('');}
    if(v!==w&&!res.includes(v))res.push(v);}
  return res;}

function buildThinkQ(g){const qs=[];const seen=new Set();let guard=0;
  while(qs.length<8&&guard++<200){
    const k=qs.length%5;let q,ans,opts,exp,sub;
    if(k===0){const a=2+rndInt(8),b=1+rndInt(4);q=`找规律：${a}, ${a+b}, ${a+2*b}, ${a+3*b}, （ ）`;ans=a+4*b;sub='每次增加相同的数';exp=`每次加 ${b}，所以最后一个数＝${a+3*b}+${b}＝${ans}。`;
      const rr=numAnswer(ans,0,30);if(seen.has(q)){continue;}seen.add(q);qs.push({q,sub,options:rr.options,answer:rr.answer,exp});continue;}
    else if(k===1){const n=3+rndInt(5);q=`排队：队伍里有 ${n} 人，小红前面有 2 人。小红的后面有几人？`;ans=n-3;sub='总人数减去前面的再减自己';exp=`${n}人里，去掉前面的2人和小红自己，后面还剩 ${ans} 人。`;
      const optsAns=numAnswer(ans,0,10);opts=optsAns.options;
      if(seen.has(q)){continue;}seen.add(q);qs.push({q,sub,options:opts,answer:optsAns.answer,exp});continue;}
    else if(k===2){const a=2+rndInt(8);q=`年龄问题：小明今年 ${a} 岁，爸爸比小明大 30 岁。爸爸今年几岁？`;ans=a+30;sub='求较大的数用加法';exp=`爸爸＝${a}＋30＝${ans} 岁。`;
      const r=numAnswer(ans,20,40);opts=r.options;if(seen.has(q)){continue;}seen.add(q);qs.push({q,sub,options:opts,answer:r.answer,exp});continue;}
    else if(k===3){const pg=2+rndInt(9),arr=[pg,pg+2,pg+3].map(String);const mixed=shuffle([pg,pg-1,pg+1,pg+2].map(String)).slice(0,3);const r=strAnswer(String(pg),[pg-1,pg+1,pg+2].map(String));q=`小丽排第 ${pg} 个。她前面有几个人？（从第1个开始数）`;sub='排第几＝前面人数＋1';exp=`排第 ${pg} 个，去掉自己1个，前面有 ${pg-1} 人。`;
      if(seen.has(q)){continue;}seen.add(q);qs.push({q,sub,options:r.options,answer:r.answer,exp});continue;}
    else{const a=2+rndInt(8),b=2+rndInt(5);const tot=a+b;q=`数量关系：草地里原有 ${a} 只鸟，又飞来 ${b} 只。现在一共（ ）只。`;sub='合并用加法';exp=`${a}＋${b}＝${tot} 只。`;const r=numAnswer(tot,2,20);
      if(seen.has(q)){continue;}seen.add(q);qs.push({q,sub,options:r.options,answer:r.answer,exp});continue;}
  }
  return qs;
}

function buildOralQ(g){
  const max=(g<=3)?20:g<=6?100:1000;const qs=[];const seen=new Set();let guard=0;
  while(qs.length<20&&guard++<400){
    let q,ans,sub,exp;
    const op=qs.length%3;
    if(op===0){const a=1+rndInt(max),b=1+rndInt(max-a);q=`${a} + ${b} = ?`;ans=a+b;sub='加法口算';exp=`${a}＋${b}＝${ans}。`;}
    else if(op===1){const a=2+rndInt(max),b=1+rndInt(a-1);q=`${a} - ${b} = ?`;ans=a-b;sub='减法口算';exp=`${a}－${b}＝${ans}。`;}
    else{const a=2+rndInt(Math.min(12,max)),b=2+rndInt(Math.min(9,12));q=`${a} × ${b} = ?`;ans=a*b;sub='乘法口算';exp=`${a}×${b}＝${ans}。`;}
    if(seen.has(q))continue;seen.add(q);
    const r=numAnswer(ans,0,Math.max(max*2,ans+10));qs.push({q,sub,options:r.options,answer:r.answer,exp,optSmall:true});
  }
  return qs;
}

const EXAM_Q=20;
/* current 以隐式全局赋值使用，需初始化为对象，否则首次点击科目（openSubject：current.sub=...）会因 undefined 抛错 */
var current={};
function buildExam(sub,g){
  const hadCurrent=!!current;
  const prevSub=hadCurrent?current.sub:undefined;
  const prevGrade=hadCurrent?current.grade:g;
  if(!hadCurrent)current={};
  current.sub=sub;state.grade=g;
  try{
  const types=(GAMES[sub][g]||[]).map(c=>c[3]);
  const pool=[];
  for(const t of types){pool.push(...(buildFor(t,g)||[]));}
  const seen=new Set(),out=[];
  for(const q of pool){const k=stripT(q.q);if(!seen.has(k)){seen.add(k);out.push(q);}if(out.length>=EXAM_Q)break;}
  if(out.length<EXAM_Q&&types.length>0){let tries=0;while(out.length<EXAM_Q&&tries++<60){const t=pick(types);for(const q of (buildFor(t,g)||[])){const k=stripT(q.q);if(!seen.has(k)){seen.add(k);out.push(q);}if(out.length>=EXAM_Q)break;}}}
  return out.slice(0,EXAM_Q);
  }finally{
    if(hadCurrent){current.sub=prevSub;current.grade=prevGrade;state.grade=prevGrade;}
    else state.grade=g;
  }
}
function startExam(sub){
  const paper=buildExam(sub,state.grade);

/* 生成一组不重复的新题：先按题型生成，再剔除同局内重复的题并补齐题量 */
function rawQuiz(type,g){
  if(current.sub==='chinese')return ({hanzi:buildHanzi,pinyin:buildPinyin,tingzi:buildTingzi,fanci:buildFanci,ciyu:buildCiyu,chengyu:buildChengyu,poemquiz:buildPoemfill,yuanwu:buildYuanwu,read:buildRead,story:buildStory}[type])(g);
  if(current.sub==='math')return ({count:buildCount,compare:buildCompare,shapes:buildShapes,addsub:buildAddsub,mulsmall:buildMulsmall,bigadd:buildBigadd,muldiv:buildMuldiv,div:buildDiv,mixed:buildMixed,order:buildOrder,dec:buildDec,frac:buildFrac,pct:buildPct,clock:buildClock,money:buildMoney,units:buildUnits,shapearea:buildShapeArea,factor:buildFactor,equation:buildEquation,circle:buildCircle,ratio:buildRatio}[type])(g);
  return ({letters:buildLetters,words:buildWords,spell:buildSpell,fill:buildFill,sent:buildSent,ipa:buildIpa}[type])(g);
}
function stripT(s){return String(s||'').replace(/<[^>]*>/g,'').trim();}
function dedupe(qs,type,g){
  const seen=new Set(),out=[];const max=qN(g);
  for(const q of qs||[]){const k=stripT(q.q);if(!seen.has(k)){seen.add(k);out.push(q);}}
  let tries=0;
  while(out.length<max&&tries++<40){const trial=rawQuiz(type,g)||[];for(const t of trial){const k=stripT(t.q);if(!seen.has(k)){seen.add(k);out.push(t);}if(out.length>=max)break;}}
  return out.slice(0,max);
}
function buildFor(type,g){return dedupe(rawQuiz(type,g),type,g);}
function quizSig(qs){try{return (qs||[]).map(q=>{const qText=(q&&q.q||'').replace(/<[^>]*>/g,'').trim();const opts=(q&&q.options||[]).map(o=>String(o).replace(/<[^>]*>/g,'').trim()).join('|');return qText+' § '+opts;}).join('◆');}catch(e){return '';}}
function freshQuiz(type,g){
  if(g==null)g=state.grade;
  if(!state.recent)state.recent=[];
  const prev=state.recent.find(r=>r.type===type&&r.g===g);
  let qs=buildFor(type,g)||[];
  const base=quizSig(qs);
  let changed=true;
  if(prev&&prev.sig&&base&&base===prev.sig){
    changed=false;
    for(let k=0;k<4&&!changed;k++){const trial=buildFor(type,g)||[];if(quizSig(trial)!==base){qs=trial;changed=true;}}
  }
  state.recent=state.recent.filter(r=>!(r.type===type&&r.g===g));
  state.recent.push({type,g,sig:quizSig(qs)||base});
  if(state.recent.length>8)state.recent=state.recent.slice(-8);
  save();
  qs.changed=changed&&!!prev;
  return qs;
}

/* ================= 数学：珠心算课程（认识算盘 + 看算盘读数练习） ================= */
const ABA_PLACE=['个','十','百','千','万'];
function abacusDigitHTML(d,plName){
  const top=d>=5,low=d>=5?d-5:d;
  return `<div class="aba-col">
    <div class="aba-top"><div class="aba-bead ${top?'on':''}"></div></div>
    <div class="aba-sep"></div>
    <div class="aba-low">${[3,2,1,0].map(i=>`<div class="aba-bead ${low>i?'on':''}"></div>`).join('')}</div>
    <div class="aba-num">${plName}</div>
  </div>`;
}
function renderAbacus(num){const s=String(num),n=s.length;return `<div class="aba">${s.split('').map((c,i)=>abacusDigitHTML(+c,ABA_PLACE[n-1-i])).join('')}</div>`;}
const ABA_MAXD=g=>g<=3?2:g<=5?3:4;
const abacusDrill={qs:[],idx:0,correct:0};
function buildAbacusDrill(g){
  const maxD=ABA_MAXD(g),hi=Math.pow(10,maxD)-1,lo=Math.pow(10,maxD-1);
  const qs=[];const seen=new Set();let guard=0;
  while(qs.length<8&&guard++<300){const val=lo+rndInt(hi-lo+1);if(seen.has(val))continue;if(lastDigitZero(val))continue;seen.add(val);
    const opts=new Set([val]);let g2=0;while(opts.size<4&&g2++<60){const dv=(rndInt(13)-6)*Math.pow(10,rndInt(maxD));const c=val+dv;if(c>=0&&c<=hi&&!opts.has(c))opts.add(c);}
    const r=strAnswer(val,[...opts].filter(x=>x!==val).slice(0,3));qs.push({val,options:r.options,answer:r.answer});
  }
  return qs;}
function lastDigitZero(v){return v%10===0;}
function openAbacus(){current.sub='math';renderAbacusLearn();show('screen-subject');}
function renderAbacusLearn(){
  $('#screen-subject').innerHTML=`
    <div class="quiz-head"><button class="back" onclick="goHome()">🏠 首页</button>
      <button class="back" onclick="current.sub='math';refreshSubject()">🧮 数学</button></div>

    <div class="notice">珠就是算盘上的珠子，心算就是“把算盘装进脑子里”来算。先认识算盘，再来挑战读算盘！</div>
    <div class="learn-card" style="background:linear-gradient(180deg,#fff,#fff8ec);box-shadow:0 -6px 0 var(--gold),var(--shadow)">

      <div style="font-size:14px;font-weight:700;color:#5a6b8c;margin-top:6px">上框 1 颗珠＝5 · 下框 1 颗珠＝1 · 从左到右是 千 百 十 个。</div>
    </div>

function startAbacusDrill(){abacusDrill.qs=buildAbacusDrill(state.grade);abacusDrill.idx=0;abacusDrill.correct=0;renderAbacusDrill();}

function abacusPick(el,i){
  const q=abacusDrill.qs[abacusDrill.idx];const nb=$('#nextAb');
  document.querySelectorAll('.opt').forEach(o=>o.classList.add('disabled'));if(nb)nb.style.display='';
  const fb=$('#fb');
  if(i===q.answer){el.classList.add('correct');abacusDrill.correct++;fb.className='feedback ok';fb.textContent='读对啦！算盘表示 '+q.val+'，真棒！';playSound('correct');addXp(2);}
  else{el.classList.add('wrong');document.querySelectorAll('.opt')[q.answer].classList.add('correct');fb.className='feedback no';fb.textContent='这个数是 '+q.val+'，再数数珠子吧～';playSound('wrong');}
  nb.textContent=(abacusDrill.idx===abacusDrill.qs.length-1)?'🎉 看成绩':'→ 下一题';
}

const PZ_DIFF=['🍎','🍌','🍇','🍓','🍊','🍑','🍈','🍒','🫐','🍋','🌶️','🍄'];
function renderFindDiff(){
  const g=state.grade,n=(g<=2?3:g<=4?4:5),tot=n*n,diff=(g<=2?3:g<=4?5:8);
  pzClearTimer();
  // 原图：每格一个图案；相异：随机 diff 个格子换成另一个图案
  const base=Array.from({length:tot},()=>pick(PZ_DIFF));
  const diffIdx=shuffle(Array.from({length:tot},(_,i)=>i)).slice(0,Math.min(diff,tot));
  const diffMap={};
  diffIdx.forEach(i=>{
    let alt=pick(PZ_DIFF);let guard=0;
    while(alt===base[i]&&guard<8){alt=pick(PZ_DIFF);guard++;}
    diffMap[i]=alt;
  });
  pz={kind:'finddiff',n,tot,diff,diffIdx,diffMap,found:0,miss:0,start:Date.now(),done:false};
  const cell=(i,right,isDiff)=>{const content=right?(diffMap[i]||base[i]):base[i];const diffClass=isDiff&&right?` class="pz-cell diff-cell"`:' class="pz-cell"';
    const cw=n===3?96:n===4?72:58;
    return `<div${diffClass} style="width:${cw}px;height:${cw}px;font-size:${n===3?34:n===4?30:24}px" onclick="findDiffCell(this,${i})">${content}</div>`;};
  $('#screen-puzzle').innerHTML=pzHead('🧩','找不同','找出右边的图里，和左边不一样的地方！')+`
    <div class="pz-stat"><b>⏱ <span id="pzTime">0.0</span> 秒</b><b>🔍 已找到 <span id="pzFound">0</span>/${diff}</b><b>❌ <span id="pzMiss">0</span></b></div>

      <div><div style="text-align:center;font-weight:900;color:#4f9df7;margin-bottom:4px">原图</div>
        <div class="pz-board" style="grid-template-columns:repeat(${n},${n===3?96:n===4?72:58}px)">${Array.from({length:tot},(_,i)=>cell(i,false)).join('')}</div></div>
      <div><div style="text-align:center;font-weight:900;color:#2a3a55;margin-bottom:4px">找不同（点这里）</div>
        <div class="pz-board" style="grid-template-columns:repeat(${n},${n===3?96:n===4?72:58}px)">${Array.from({length:tot},(_,i)=>cell(i,true)).join('')}</div></div>
    </div>
    <div class="pz-memo" style="text-align:center;margin-top:8px">一格一格对比，先找相同规律，特别的地方就是答案</div>`;

  pz.timer=setInterval(()=>{const e=$('#pzTime');if(e&&!pz.done)e.textContent=((Date.now()-pz.start)/1000).toFixed(1);},100);
}
function findDiffCell(el,i){
  if(!pz||pz.done)return;
  if(pz.found!==undefined&&pz.findDiffFound&&pz.findDiffFound[i])return; // guard
  pz.findDiffFound=pz.findDiffFound||{};

}

const RW_KEY='funReward';
const RW_VER=2;
const RW_DEFAULT=[['🧋','奶茶一杯',600],['🍔','KFC 小食一次',1000],['📱','玩手机 20 分钟',700],['📺','看动画 30 分钟',500],['🍦','冰淇淋一个',400],['🎁','神秘礼包',800],['🎳','亲子出游一次',2000]];
const RW_DEFAULT_V1=[['🧋','奶茶一杯',30],['🍔','KFC 小食一次',50],['📱','玩手机 20 分钟',25],['📺','看动画 30 分钟',20],['🍦','冰淇淋一个',15],['🎁','神秘礼包',40],['🎳','亲子出游一次',100]];
let rw={list:RW_DEFAULT.slice(),claims:[],pin:'8888',v:RW_VER};
function sameRows(a,b){if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length)return false;return a.every((r,i)=>Array.isArray(r)&&b[i]&&r[0]===b[i][0]&&r[1]===b[i][1]&&r[2]===b[i][2]);}
function rwClaimKey(){return _K('funRewardC');}
function rwLoad(){const fresh={list:RW_DEFAULT.slice(),claims:[],pin:'8888',v:RW_VER};try{const s=JSON.parse(localStorage.getItem(RW_KEY)||'null');if(s&&Array.isArray(s.list)){if(s.v===RW_VER){rw={list:s.list,claims:s.claims||[],pin:s.pin||'8888',v:RW_VER};}else if(sameRows(s.list,RW_DEFAULT_V1)){rw=fresh;rwStore();}else{rw={list:s.list,claims:s.claims||[],pin:s.pin||'8888',v:RW_VER};}}else{rw=fresh;rwStore();}}catch(e){rw=fresh;rwStore();}
  try{const c=JSON.parse(localStorage.getItem(rwClaimKey())||'null');if(c&&Array.isArray(c))rw.claims=c;}catch(e){}}
function rwStore(){try{localStorage.setItem(RW_KEY,JSON.stringify({list:rw.list,pin:rw.pin,v:rw.v}));localStorage.setItem(rwClaimKey(),JSON.stringify(rw.claims||[]));}catch(e){}}
function rwHead(){return `<div class="quiz-head"><button class="back" onclick="goHome()">🏠 首页</button><span class="q-label">🎁 积分商城</span></div>
  <div class="hero" style="padding-top:6px"><div class="big">🎁</div><h1>积分商城</h1><p>用学习积分兑换奖励，越努力越有惊喜！</p></div>`;}
function openReward(){showReward();}
function showReward(){
  $('#screen-reward').innerHTML=rwHead()+`
    <div class="pw-balance">⭐ 我的积分 <b style="color:#e07a00;font-size:26px">${state.xp}</b></div>
    <div style="margin-top:14px">
      ${rw.list.map((it,i)=>`
        <div class="rw-item ${state.xp>=it[2]?'':'locked'}">
          <div class="rw-emo">${it[0]}</div>
          <div class="rw-name">${it[1]}</div>
          <div class="rw-cost">${it[2]} 积分</div>
          <button class="rw-claim" ${state.xp>=it[2]?'onclick="rwClaim('+i+')"':'disabled'}>${state.xp>=it[2]?'🌟 立即兑换':'积分不足'}</button>
        </div>`).join('')}
    </div>
    <div class="btn-row">
      <button class="btn go" style="background:linear-gradient(135deg,#56c2c9,#4f9df7)" onclick="showClaims()">🧾 我的兑换（${rw.claims.length}）</button>
      <button class="btn go" style="background:linear-gradient(135deg,#aaa,#888);color:#fff" onclick="rwAdminDoor()">👤 家长设置</button>
    </div>`;
  show('screen-reward');
}
function rwClaim(i){
  const it=rw.list[i];if(!it)return;
  if(state.xp<it[2]){toast('积分还不够哦，继续加油！');return;}
  if(!confirm('确定用 '+it[2]+' 积分兑换「'+it[1]+'」吗？'))return;
  state.xp-=it[2];save();updateTop();
  const c={id:Date.now()+'_'+i,n:it[1],emo:it[0],cost:it[2],time:new Date().toLocaleString('zh-CN',{hour12:false}),state:'待兑现'};
  rw.claims.unshift(c);rwStore();
  toast('🎉 已生成兑换凭证！找家长确认吧');showReward();
}
function showClaims(){
  const list=rw.claims;
  $('#screen-reward').innerHTML=rwHead()+`
    <div style="font-size:16px;font-weight:900;color:#2a3a55;margin:6px 0 10px">🧾 我的兑换凭证</div>
    ${list.length===0?'<div class="card-q" style="text-align:center"><div class="q-text">还没有兑换记录，先去赚积分吧！</div></div>':
      list.map(c=>`
      <div class="claim-row">
        <div style="font-size:28px">${c.emo}</div>
        <div style="flex:1"><div style="font-weight:900;color:#2a3a55">${c.n} <span style="color:#c08a1a">(-${c.cost})</span></div>
        <div style="font-size:12px;color:#8a9ab8">${c.time} · ${c.state}</div></div>
        ${c.state==='待兑现'?`<button class="s-btn" style="background:#ffe9c7;color:#a05b00" onclick="rwConfirm('${c.id}')">✅ 兑现成功</button>`:`<button class="s-btn" style="background:#e8f9ee;color:#2ea96b">🎉 已兑现</button>`}
      </div>`).join('')}
    <div class="btn-row"><button class="btn go" style="min-width:100%" onclick="showReward()">↩ 返回商城</button></div>`;
  show('screen-reward');
}
function rwConfirm(id){const c=rw.claims.find(x=>x.id===id);if(c){c.state='已兑现';rwStore();showClaims();toast('✅ '+c.n+' 已兑现，孩子做得好！');}}
function rwAdminDoor(){
  const pin=prompt('这是家长设置区，请输入口令：');if(!pin)return;
  if(pin!==rw.pin){toast('口令不对哦');return;}
  rwAdmin();
}
function rwAdmin(){
  $('#screen-reward').innerHTML=rwHead()+`
    <div class="card-q">
      <div style="font-weight:900;color:#2a3a55">👤 家长设置</div>
      <div style="font-size:13px;color:#8a9ab8;margin:2px 0 10px">口令：${rw.pin}（可改）</div>
      <button class="btn go" style="min-width:100%;margin-bottom:8px" onclick="rwAddPoints()">✨ 给孩子加分</button>
      <button class="btn go" style="min-width:100%;margin-bottom:8px" onclick="rwAddItem()">➕ 新增奖励项</button>
      <button class="btn go" style="min-width:100%;margin-bottom:8px" onclick="rwDelItem()">➖ 删除奖励项</button>
      <button class="btn go" style="min-width:100%;margin-bottom:8px" onclick="rwChangePin()">🔑 修改口令</button>
      <button class="btn go" style="background:linear-gradient(135deg,#ff9a8b,#ff6b7a);color:#fff;min-width:100%" onclick="rwReset()">🗑️ 清空全部兑换记录</button>
    </div>
    <div class="btn-row"><button class="btn go" style="min-width:100%" onclick="showReward()">↩ 返回商城</button></div>`;
  show('screen-reward');
}
function rwAddPoints(){const s=prompt('输入要给孩子增加的积分（用减号可扣减）：');if(s==null)return;const n=parseInt(s);if(!isNaN(n)){state.xp+=n;save();updateTop();toast('✅ 积分已更新，当前 '+state.xp);showReward();}}
function rwAddItem(){const s=prompt('新增奖励，格式：奖励名称,所需积分（如 蛋糕一块,25）：');if(!s)return;const p=s.split(',');const cost=parseInt((p[1]||'').trim());if(!p[0]||p[0].trim()===''||isNaN(cost)||cost<=0){toast('格式不对，请用：名称,积分');return;}rw.list.push(['🎁',p[0].trim(),cost]);rwStore();showReward();toast('已添加奖励');}
function rwDelItem(){const s=prompt('输入要删除的奖励名称：');if(!s)return;const i=rw.list.findIndex(x=>x[1]===s.trim());if(i<0){toast('没找到该奖励');return;}rw.list.splice(i,1);rwStore();showReward();toast('已删除');}
function rwChangePin(){const s=prompt('输入新口令（至少4位）：');if(!s||s.length<4){toast('口令需至少4位');return;}rw.pin=s;rwStore();toast('✅ 口令已更新');rwAdmin();}
function rwReset(){if(!confirm('确定清空所有兑换记录吗？此操作不可恢复。'))return;rw.claims=[];rwStore();showReward();toast('已清空');}

/* ===== 启动：加载用户档案，每次打开都先显示登录选人页(需密码进入) ===== */
loadUsers();
applyUser(users.current||users.list[0].id);
renderHome();
showLoginFirstRun();
</script>
</body>
</html>
